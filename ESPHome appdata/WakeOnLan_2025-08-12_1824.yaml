output:
  # On ESP32-C3-DevKitM-1 the onboard RGB LED is often on GPIO8.
  # Change the pin below if your LED is on a different GPIO.
  - platform: gpio
    pin:
      number: 8
      inverted: true
      mode: OUTPUT
    id: led_gpio

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
      id: ip_address
    ssid:
      name: ESP SSID
      id: ssid
    bssid:
      name: ESP BSSID
      id: bssid
    mac_address:
      name: ESP MAC
      id: mac
  - platform: template
    name: ESP AP IP
    id: ap_ip
    lambda: |-
      if (id(ip_address).has_state() && id(ip_address).state != "") {
        return {};
      } else {
        return std::string("192.168.4.1");
      }
    update_interval: 5s

sensor:
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    update_interval: 60s

globals:
  - id: display_on
    type: bool
    restore_value: no
    initial_value: 'true'  # true = display on, false = display off
  - id: display_timeout_min
    type: int
    restore_value: yes
    initial_value: '2'   # minutes until auto-off; 0 = never turn off
  - id: default_screen
    type: int
    restore_value: yes
    initial_value: '0'  # 0=page 1, 5=page 6 (blank)
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_interaction
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: wake_interval
    type: int
    restore_value: yes
    initial_value: '32'
  - id: last_wake
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: mac1
    type: std::string
    restore_value: yes
    initial_value: '"11:00:0A:BB:28:FC"'
  - id: mac2
    type: std::string
    restore_value: yes
    initial_value: '"00:22:00:00:00:00"'
  - id: mac3
    type: std::string
    restore_value: yes
    initial_value: '"00:00:33:00:00:00"'
  - id: mac4
    type: std::string
    restore_value: yes
    initial_value: '"00:00:00:44:00:00"'
  - id: mac5
    type: std::string
    restore_value: yes
    initial_value: '"00:00:00:00:55:00"'
  - id: mac6
    type: std::string
    restore_value: yes
    initial_value: '"00:00:00:00:00:66"'
  - id: mac1_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: mac2_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: mac3_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mac4_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mac5_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mac6_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  - id: wake_all_devices
    mode: queued
    then:
      - lambda: |-
          using namespace esphome::wake_on_lan_config;
          static WakeOnLanConfig wol;
          id(blink_led).execute();
          if (id(mac1_enabled) && id(mac1) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac1));
          if (id(mac2_enabled) && id(mac2) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac2));
          if (id(mac3_enabled) && id(mac3) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac3));
          if (id(mac4_enabled) && id(mac4) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac4));
          if (id(mac5_enabled) && id(mac5) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac5));
          if (id(mac6_enabled) && id(mac6) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac6));
  - id: blink_led
    mode: restart
    then:
      - output.turn_on: led_gpio
      - delay: 200ms
      - output.turn_off: led_gpio

interval:
  - interval: 60s
    then:
      - lambda: |-
          unsigned long now = millis();
          if (now - id(last_wake) >= id(wake_interval) * 60 * 1000) {
            id(last_wake) = now;
            using namespace esphome::wake_on_lan_config;
            static WakeOnLanConfig wol;
            id(blink_led).execute();
            if (id(mac1_enabled) && id(mac1) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac1));
            if (id(mac2_enabled) && id(mac2) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac2));
            if (id(mac3_enabled) && id(mac3) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac3));
            if (id(mac4_enabled) && id(mac4) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac4));
            if (id(mac5_enabled) && id(mac5) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac5));
            if (id(mac6_enabled) && id(mac6) != "00:00:00:00:00:00") wol.send_magic_packet(id(mac6));
          }
  - interval: 1s
    then:
      - lambda: |-
          // Auto-blank display after configured timeout
          if (id(display_timeout_min) > 0) {
            unsigned long now = millis();
            if (now - id(last_interaction) >= (unsigned long)id(display_timeout_min) * 60UL * 1000UL) {
              id(current_page) = 5;  // go to last page (blank)
            }
          }

