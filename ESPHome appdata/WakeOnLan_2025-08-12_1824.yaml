text:

  - platform: template
    name: "About / Version"
    id: about_info
    mode: text
    initial_value: "2025-08-12_1824"
    restore_value: false
    optimistic: true

  - platform: template
    name: "Wake Every 1-4608 min."
    id: wake_interval_text
    mode: text
    initial_value: "80"
    restore_value: true
    set_action:
      - lambda: |-
          int val = atoi(x.c_str());
          if (val > 0 && val <= 4608) {
            id(wake_interval) = val;
          }

  - platform: template
    name: "Display Timeout Minutes (0=never)"
    id: display_timeout_text
    mode: text
    initial_value: "2"
    restore_value: true
    set_action:
      - lambda: |-
          int val = atoi(x.c_str());
          if (val >= 0 && val <= 240) {  // cap to 4 hours
            id(display_timeout_min) = val;
          }

  - platform: template
    name: "Default Screen (0-6, 0=off)"
    id: default_screen_text
    mode: text
    initial_value: "1"
    restore_value: true
    set_action:
      - lambda: |-
          int val = atoi(x.c_str());
          if (val == 0) {
            id(default_screen) = 5;  // 0 maps to blank (page 6)
          } else if (val >= 1 && val <= 6) {
            id(default_screen) = val - 1;  // store as 0-based index
          }


  - platform: template
    name: "MAC 1"
    id: mac1_text
    mode: text
    initial_value: "11:00:0A:BB:28:FC"
