binary_sensor:
  - platform: gpio
    pin:
      number: 9
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button (GPIO9)"
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_click:
      - min_length: 75ms
        max_length: 2s
        then:
          - lambda: |-
              // Debounced click: if display off, wake to default page; else cycle pages
              if (!id(display_on)) {
                id(display_on) = true;
                int target = id(default_screen);
                if (target == 5) target = 0;  // if default is blank, show page 1 on wake
                id(current_page) = target;
              } else if (id(current_page) == 5) {
                int target = id(default_screen);
                if (target == 5) target = 0;
                id(current_page) = target;
              } else {
                id(current_page) = (id(current_page) + 1) % 6;
              }
              id(last_interaction) = millis();

  - platform: template
    name: "Display On State"
    lambda: |-
      return id(display_on);

display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    address: 0x3C
    lambda: |-
      // If display is logically off, do not draw anything
      if (!id(display_on)) return;
      if (id(current_page) == 5) {
        // Draw a fully black frame to blank the display
        it.fill(COLOR_OFF);
        return;
      }
      int page = id(current_page);

      if (page == 0) {
        // WiFi/AP info
        if (id(ip_address).has_state() && id(ip_address).state != "") {
          it.printf(0, 0, id(font1), "WiFi: %s", id(ssid).state.c_str());
          it.printf(0, 20, id(font1), "IP: %s", id(ip_address).state.c_str());
        } else {
          it.printf(0, 0, id(font1), "WakeOnLan-APmode");
          it.printf(0, 10, id(font1), "Pass: password");
          it.printf(0, 20, id(font1), "192.168.4.1");
        }
        it.printf(0, 30, id(font1), "%s", id(mac).state.c_str());

      } else if (page == 1) {
        // System info
        unsigned long uptime = (unsigned long)id(uptime_sensor).state;
        unsigned long next_wol = id(wake_interval)*60 - ((millis() - id(last_wake))/1000);
        if ((long)next_wol < 0) next_wol = 0;
        it.printf(0, 0, id(font1), "Uptime: %lus", uptime);
        it.printf(0, 10, id(font1), "Next WOL: %lus", next_wol);
        it.printf(0, 20, id(font1), "Interval: %dmin", id(wake_interval));
        it.printf(0, 30, id(font1), "Page: %d", id(current_page)+1);

      } else if (page == 2) {
        // MAC 1 & 2
        {
          std::string n1 = id(mac1_note);
          if (n1.length() > 10) n1 = n1.substr(0, 10);
          it.printf(0, 0, id(font1), "MAC1:%s %s", id(mac1_enabled) ? "on" : "off", n1.c_str());
        }
        it.printf(0, 10, id(font1), "%s", id(mac1).c_str());
        {
          std::string n2 = id(mac2_note);
          if (n2.length() > 10) n2 = n2.substr(0, 10);
