output:
  # On ESP32-C3-DevKitM-1 the onboard RGB LED is often on GPIO8.
  # Change the pin below if your LED is on a different GPIO.
  - platform: gpio
    pin:
      number: 8
      inverted: true
      mode: OUTPUT
    id: led_gpio

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
      id: ip_address
    ssid:
      name: ESP SSID
      id: ssid
    bssid:
      name: ESP BSSID
      id: bssid
    mac_address:
      name: ESP MAC
      id: mac
  - platform: template
    name: ESP AP IP
    id: ap_ip
    lambda: |-
      if (id(ip_address).has_state() && id(ip_address).state != "") {
        return {};
      } else {
        return std::string("192.168.4.1");
      }
    update_interval: 5s

sensor:
  - platform: uptime
    name: "Device Uptime"
    id: uptime_sensor
    update_interval: 60s

globals:
  - id: display_on
    type: bool
    restore_value: no
    initial_value: 'true'  # true = display on, false = display off
  - id: display_timeout_min
    type: int
    restore_value: yes
    initial_value: '2'   # minutes until auto-off; 0 = never turn off
  - id: default_screen
    type: int
    restore_value: yes
    initial_value: '0'  # 0=page 1, 5=page 6 (blank)
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_interaction
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: wake_interval
    type: int
    restore_value: yes
    initial_value: '32'
  - id: last_wake
    type: unsigned long
    restore_value: no
    initial_value: '0'

  # Repeat count for each WOL magic packet (1-10)
  - id: wol_repeats
    type: int
    restore_value: yes
    initial_value: '3'
  # WOL UDP destination port (commonly 7 or 9)
  - id: wol_port
    type: int
    restore_value: yes
    initial_value: '9'

  - id: mac1
    type: std::string
    restore_value: yes
    initial_value: '"11:00:0A:BB:28:FC"'
  - id: mac2
    type: std::string
    restore_value: yes
    initial_value: '"00:22:00:00:00:00"'
  - id: mac3
