esphome:
  name: juke32-wakeonlan
  friendly_name: github.com/juke32/WakeOnLan
  includes:
    - components/wake_on_lan_config/wake_on_lan_config.h
  on_boot:
    priority: 800.0
    then:
      - output.turn_off: led_gpio
      - lambda: |-
          // Initialize display state: if default_screen mapped to blank (value 5) treat as OFF at boot
          if (id(default_screen) == 5) {
            id(display_on) = false;      // fully off (nothing drawn)
            id(current_page) = 5;        // blank page index
          } else {
            id(display_on) = true;
            id(current_page) = id(default_screen);
          }
          id(last_interaction) = millis();
          // Apply stored WOL port value
          using namespace esphome::wake_on_lan_config;
          set_wol_port(id(wol_port));
      - delay: 3min
      - lambda: |-
          using namespace esphome::wake_on_lan_config;
          std::vector<std::string> macs;
          if (id(mac1_enabled) && id(mac1) != "00:00:00:00:00:00") macs.push_back(id(mac1));
          if (id(mac2_enabled) && id(mac2) != "00:00:00:00:00:00") macs.push_back(id(mac2));
          if (id(mac3_enabled) && id(mac3) != "00:00:00:00:00:00") macs.push_back(id(mac3));
          if (id(mac4_enabled) && id(mac4) != "00:00:00:00:00:00") macs.push_back(id(mac4));
          if (id(mac5_enabled) && id(mac5) != "00:00:00:00:00:00") macs.push_back(id(mac5));
          if (id(mac6_enabled) && id(mac6) != "00:00:00:00:00:00") macs.push_back(id(mac6));
          if (!macs.empty()) {
            wol_start(macs, id(wol_repeats), [](bool on){ if (on) id(led_gpio).turn_on(); else id(led_gpio).turn_off(); });
          }

